# Runs the whole test suite (pytest + the Node tests for web/index.html) on every push and pull request.
#
# Required: Python 3.12 with the EXACT versions in requirements-lock.txt - the environment the suite was checked in.
# Informational: Python 3.10, 3.11 and 3.13 with the version RANGES in requirements.txt. They have not all been tried
# by hand yet, so a failure there does not fail the run (the job still shows a red cross). When one of them has
# passed a few times, set its `experimental` to false.
name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", deps: requirements-lock.txt, experimental: false }
          - { python: "3.13", deps: requirements-dev.txt, experimental: true }
          - { python: "3.11", deps: requirements-dev.txt, experimental: true }
          - { python: "3.10", deps: requirements-dev.txt, experimental: true }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Four video tests (test_resync.py, test_video_invisible.py, test_wmapp.py) fail without an ffmpeg binary on PATH,
      # so install it instead of relying on whatever the runner image happens to ship.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.deps }}

      - name: Check the installed set is consistent
        if: matrix.deps == 'requirements-lock.txt'
        run: pip check

      # Without jsdom the page-boot test in tests/js skips itself, so install it here to run all of the JS tests.
      - name: Install jsdom (Node tests)
        run: npm ci --no-audit --no-fund
        working-directory: tests/js

      - name: Run the tests
        run: python -m pytest tests -q
